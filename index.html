<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>StreamBox — Filmes, Séries e Animes</title>
<meta name="description" content="Descubra filmes, séries, animes e canais em alta no StreamBox." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" />
<style>
:root{--bg:#0f0f10;--card:#18181c;--sec:#232328;--muted:#9a9aa3;--fg:#f4f4f6;--pri:#2f8bff;--star:#f5c518;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,sans-serif;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}
header{position:fixed;inset:0 0 auto;z-index:40;background:rgba(15,15,16,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.wrap{max-width:1280px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}.logo span{color:var(--pri)}
.icons{display:flex;gap:4px;align-items:center}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}.ib:hover{background:var(--sec)}
.dot{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pri);display:grid;place-items:center;box-shadow:0 0 24px rgba(47,139,255,.45);margin-left:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}
.tab{flex-shrink:0;padding:7px 16px;border-radius:999px;background:var(--sec);color:var(--muted);font-size:14px;font-weight:500}
.tab.on{background:var(--pri);color:#fff;box-shadow:0 0 24px rgba(47,139,255,.45)}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;height:78vh;min-height:480px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,rgba(15,15,16,.7) 40%,transparent 75%)}
.hc{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 40px}
.kick{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--pri)}
.hero h1{font-size:clamp(32px,6vw,60px);font-weight:800;line-height:1.1;margin-top:8px;max-width:680px}
.meta{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:12px}.meta .y{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:3px}.st svg{width:15px;height:15px;fill:var(--star);stroke:var(--star)}
.ov{margin-top:12px;max-width:560px;color:rgba(244,244,246,.8);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:12px;margin-top:20px}
.bp,.bs{height:48px;padding:0 22px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bp{background:var(--pri);color:#fff;box-shadow:0 0 24px rgba(47,139,255,.45)}.bs{background:rgba(35,35,40,.85)}
.badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.rL{background:#008000}.r10{background:#0000ff}.r12{background:#ffd700;color:#000}.r14{background:#ff8c00}.r16{background:#ff0000}.r18{background:#000;box-shadow:0 0 0 1px #666}.rNA{background:#5f6368}
.rows{position:relative;z-index:2}section.row{margin-top:30px}
.row h2{display:flex;align-items:center;gap:8px;padding:0 16px;margin-bottom:12px;font-size:18px;font-weight:700}
.row h2:before{content:"";width:4px;height:20px;border-radius:4px;background:var(--pri)}
.scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory}
.scroll>.c{width:30vw;max-width:160px;flex-shrink:0;scroll-snap-align:start}
@media(min-width:640px){.scroll>.c{width:150px}}
.c{text-align:left;width:100%}
.pc{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--sec)}
.pc img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.c:hover .pc img{transform:scale(1.05)}
.c:hover .pc{outline:2px solid var(--pri)}
.prog{position:absolute;inset:auto 0 0;height:4px;background:rgba(255,255,255,.2)}.prog div{height:100%;background:var(--pri)}
.ct{margin-top:6px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--muted);min-height:24px}.cm .st svg{width:12px;height:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.bnav{position:fixed;inset:auto 0 0;z-index:40;background:rgba(24,24,28,.95);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bnav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}.nb svg{width:24px;height:24px}.nb.on{color:var(--pri)}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(15,15,16,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ovl{align-items:center}}
.sheet{width:100%;max-width:680px;max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 20px 40px;animation:up .3s}
@media(min-width:640px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.sh h3{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.search{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:16px 16px 100px}
.sb{display:flex;gap:8px;align-items:center;max-width:1000px;margin:0 auto}
.sin{flex:1;height:48px;display:flex;align-items:center;gap:8px;background:var(--sec);border-radius:10px;padding:0 12px;color:var(--muted)}
.sin input{flex:1;outline:none;color:var(--fg)}
.sres{max-width:1000px;margin:24px auto 0}
.muted{color:var(--muted);font-size:14px}
label.l{font-size:12px;color:var(--muted)}
select{width:100%;height:48px;margin-top:4px;border-radius:10px;background:var(--sec);border:1px solid var(--border);padding:0 10px;font-size:14px;color:var(--fg)}
.eps{display:flex;flex-direction:column;gap:8px;max-height:290px;overflow-y:auto;margin-top:12px}
.ep{display:flex;gap:12px;padding:8px;border-radius:10px;background:rgba(35,35,40,.6);text-align:left}.ep.on{background:#1d2a40;outline:1px solid var(--pri)}
.ep .th{width:112px;aspect-ratio:16/9;flex-shrink:0;border-radius:6px;overflow:hidden;background:var(--sec)}.ep .th img{width:100%;height:100%;object-fit:cover}
.ep p{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ep b{font-size:14px;display:block}
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.ph{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border-bottom:1px solid var(--border)}
.ph h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{flex:1;display:flex;align-items:center;justify-content:center}
.pf .fr{width:100%;max-width:1200px;aspect-ratio:16/9;background:var(--card);overflow:hidden}
@media(max-width:639px){.pf .fr{height:100%;aspect-ratio:auto}}@media(min-width:640px){.pf{padding:24px}.pf .fr{border-radius:14px}}
iframe{width:100%;height:100%;border:0}
.setup{max-width:440px;margin:0 auto;padding:160px 24px 0;text-align:center}
.setup input{width:100%;height:48px;margin-top:16px;border-radius:10px;background:var(--sec);padding:0 12px;outline:none;color:var(--fg)}
.setup a{color:var(--pri)}

@keyframes splashIn{0%{opacity:0;transform:scale(.9);filter:blur(6px)}60%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}@keyframes splashOut{to{opacity:0;visibility:hidden}}@keyframes removeCard{to{opacity:0;transform:translateX(-80%);width:0;margin:0}}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center}.splash.out{animation:splashOut .6s forwards}.splogo{text-align:center;animation:splashIn 1.1s both;filter:drop-shadow(0 0 34px var(--pri));font-size:34px;font-weight:800}.splogo span{color:var(--pri)}.splogo svg{width:58px;height:58px;color:var(--pri)}
.advice{position:fixed;inset:0;z-index:70;background:rgba(15,15,16,.94);display:grid;place-items:center;padding:20px}.adbox{width:min(440px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 0 32px #2f8bff33}.adhead{display:flex;gap:14px;align-items:center}.adage{width:64px;height:64px;font-size:24px}.warns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.warns span{background:var(--sec);border-radius:9px;padding:10px 5px;text-align:center;font-size:11px}.menuitem{width:100%;min-height:54px;background:rgba(35,35,40,.65);border-radius:10px;margin:5px 0;padding:0 15px;text-align:left;font-weight:600}.prefitem{width:100%;display:flex;align-items:center;gap:12px;background:rgba(35,35,40,.65);border-radius:10px;margin:7px 0;padding:14px;text-align:left}.preftext{flex:1;min-width:0}.preftext b{display:block}.preftext small{display:block;color:var(--muted);margin-top:3px}.switch{position:relative;width:44px;height:24px;border-radius:999px;background:#46464d;flex:none;transition:.2s}.switch:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#f4f4f6;transition:.2s}.switch.on{background:var(--pri)}.switch.on:after{left:22px}.pairicon{width:64px;height:64px;margin:8px auto 14px;border-radius:16px;display:grid;place-items:center;background:rgba(47,139,255,.14);color:var(--pri)}.pairinput{display:block;width:100%;height:62px;margin:20px 0 12px;border:1px solid var(--border);border-radius:12px;background:var(--sec);font:800 28px monospace;text-align:center;letter-spacing:.15em;outline:none}.pairinput:focus{border-color:var(--pri)}.devpic{width:100%;border-radius:16px;border:1px solid var(--border);margin:12px 0}.aboutcard{background:rgba(35,35,40,.6);border-radius:14px;padding:16px;margin-top:12px}.aboutcard p{font-size:14px;line-height:1.6;color:#d8d8dd;margin-top:8px}.time{font-size:10px;color:var(--muted);margin-top:3px}.tvfocus :focus{outline:3px solid var(--pri)!important;outline-offset:3px}.tvfocus .scroll>.c{width:200px;max-width:200px}
</style>

document.addEventListener("input",e=>{if(e.target.id==="pairCode"){const n=e.target.value.replace(/\D/g,"").slice(0,8);S.pairCode=n.replace(/(\d{4})(?=\d)/,"$1 ");e.target.value=S.pairCode;return}if(e.target.id!=="q")return;S.q=e.target.value;clearTimeout(st);st=setTimeout(async()=>{
  const q=S.q.trim();if(q.length<2){S.results=null;render();return}S.results="loading";render();
  const r=await tmdb("/search/multi",{query:q}).catch(()=>({results:[]}));S.results=(r.results??[]).map(x=>map(x)).filter(Boolean);needRatings(S.results);render();},350);});
document.addEventListener("change",e=>{const a=e.target.dataset.a;if(!a)return;const inPl=e.target.closest("[data-pl]");const v=inPl?S.playing:S.ep;
  if(a==="season"){v.s=+e.target.value;v.e=1}if(a==="episode")v.e=+e.target.value;render();});
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;
  if(el.dataset.a==="closeSheet"&&e.target.closest("[data-stop]")&&!e.target.closest(".sh [data-a]"))return;
  e.preventDefault();const a=el.dataset.a,m=POOL[+el.dataset.i];
  switch(a){
    case"notifs":alert("Novidades e lançamentos recentes estão disponíveis no catálogo.");break;
    case"morePair":S.moreSection="pair";render();break;case"moreList":S.moreSection="list";render();break;case"moreConfig":S.moreSection="config";render();break;case"togglePref":S.prefs[el.dataset.v]=!S.prefs[el.dataset.v];save("sb-prefs",S.prefs);render();break;case"pairSubmit":{const code=(document.getElementById("pairCode")?.value||"").replace(/\D/g,"");if(code.length!==8)alert("Digite os 8 números exibidos na TV.");else alert("Para sincronizar aparelhos, conecte o aplicativo ao serviço online do StreamBox durante o empacotamento.");break}case"moreHelp":S.moreSection="help";render();break;case"moreAbout":S.moreSection="about";render();break;case"moreBack":S.moreSection="menu";render();break;case"listTab":S.listTab=el.dataset.v;render();break;case"adBack":S.advisory=null;document.body.style.overflow="";render();break;case"adGo":S.playing=S.advisory;S.advisory=null;render();break;
    case"savekey":{const k=document.getElementById("key").value.trim();if(!k)return;S.key=k;localStorage.setItem("sb-key",k);S.cat={};loadTab(S.tab);render();break}
    case"resetkey":if(confirm("Trocar a chave do TMDB?")){localStorage.removeItem("sb-key");S.key="";S.cat={};S.error=null;render();}break;
    case"tab":setTab(el.dataset.t);break;
    case"search":S.searchOpen=true;render();break;
    case"closeSearch":S.searchOpen=false;render();break;
    case"more":S.moreOpen=true;render();break;
    case"closeSheet":S.sel=null;S.moreOpen=false;render();break;
    case"pick":S.moreOpen=false;S.sel=m;S.ep={s:1,e:1};needRatings([m]);render();break;
    case"watch":watch(m);break;
    case"watchSel":watch(S.sel,{...S.ep});break;
    case"toggle":toggleList(m);break;
    case"ep":{const v=el.closest("[data-pl]")?S.playing:S.ep;v.e=+el.dataset.e;render();break}
    case"closePlayer":saveProgress();S.playing=null;document.body.style.overflow="";render();break;
  }});
let hold;document.addEventListener("pointerdown",e=>{const c=e.target.closest("[data-long=\"1\"]");if(c)hold=setTimeout(()=>{const m=POOL[+c.dataset.i];if(confirm(`Remover ${m.title} do Continuar Assistindo?`)){S.watching=S.watching.filter(x=>!(x.id===m.id&&x.type===m.type));save("sb-watching",S.watching);render()}},900)});["pointerup","pointercancel","pointerleave"].forEach(n=>document.addEventListener(n,()=>clearTimeout(hold)));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.playing){saveProgress();S.playing=null;document.body.style.overflow="";render();}});
const tv=/Android TV|GoogleTV|SmartTV|SMART-TV|Tizen|Web0S|webOS|AFT[A-Z]|BRAVIA|HbbTV|CrKey|Roku/i.test(navigator.userAgent)||new URLSearchParams(location.search).get("tv")==="1";if(tv)document.body.classList.add("tvfocus");window.addEventListener("pagehide",saveProgress);setTimeout(()=>document.getElementById("splash")?.classList.add("out"),1900);setTimeout(()=>document.getElementById("splash")?.remove(),2500);
render();if(S.key)loadTab(S.tab);
</script>
